name: refresh-data

# 上游 CodexRadar 基本每日更新，这里跟在其日更之后跑一次。
# UTC 00:30 ≈ 北京时间 08:30。
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # scripts/refresh.mjs 只用 Node 内置模块，不需要装依赖。
      - name: Refresh data
        run: node scripts/refresh.mjs

      - name: Commit data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/radar-bench.json public/data/round.json public/data/status.json
          if ! git diff --cached --quiet; then
            # [skip ci] 抑制由 GITHUB_TOKEN 推送触发的 push 事件（防递归），
            # 部署改由 deploy.yml 的 workflow_run 触发，不会漏。
            git commit -m "chore(data): refresh RadarBench data [skip ci]"
            git pull --rebase --autostash origin main
            git push
          else
            echo "no data change"
          fi

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "refresh-data failed" \
            --body "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
