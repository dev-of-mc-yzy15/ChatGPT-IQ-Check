name: refresh-data

# 上游 CodexRadar 基本每日更新，这里跟在其日更之后跑一次。
# UTC 00:30 ≈ 北京时间 08:30。
on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          # 没了 merge-base 就没法 rebase 到 origin/main，浅克隆会直接失败。
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # scripts/refresh.mjs 只用 Node 内置模块，不需要装依赖。
      - name: Refresh data
        run: node scripts/refresh.mjs

      - name: Commit data if changed
        env:
          DATA_PATHS: public/data/radar-bench.json public/data/round.json public/data/status.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain -- $DATA_PATHS)" ]; then
            echo "no data change"
            exit 0
          fi
          # 先把数据改动挂起来让工作区干净，同步到最新 main 之后才提交。
          # 原来是先 commit 再 pull --rebase --autostash，rebase 会把本地提交
          # 和远端提交堆成一条，冲突出没出都说不清。
          git stash push -u -- $DATA_PATHS
          git fetch origin main
          git rebase origin/main
          git stash pop
          git add $DATA_PATHS
          # [skip ci] 抑制由 GITHUB_TOKEN 推送触发的 push 事件（防递归），
          # 部署改由 deploy.yml 的 workflow_run 触发，不会漏。
          git commit -m "chore(data): refresh RadarBench data [skip ci]"
          git push

      - name: Open issue on failure
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="refresh-data failed"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # 日更失败会天天触发，同一标题已经有 open issue 就补一条评论，
          # 不要每天刷一个新的把看板淹掉。
          EXISTING="$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$EXISTING" ]; then
            echo "reusing open issue #$EXISTING"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
