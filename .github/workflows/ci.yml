name: ci

# 整改的每个 P0 都要在合并前拿到红/绿证据，不能只在 main 上事后验。
# 这里只跑测试/类型/构建，不发布；发布仍由 deploy.yml 单向负责。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      # 构建链不需要 postinstall：lockfile 里只有 fsevents 带 install script，
      # 而它只在 darwin 上安装。--ignore-scripts 砍掉安装期的任意代码执行面。
      - run: npm ci --ignore-scripts

      # 本仓库默认 registry 是 npmmirror，它没实现 audit API（会返回 NOT_IMPLEMENTED），
      # 所以这里显式指向官方 registry，否则这一步等于空跑。
      - run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org/
      - run: npm test
      # build 里已经含 tsc -b 和 typecheck:scripts，不再单独重复一遍。
      - run: npm run build
      # 构建后校验产物里没有回退到根绝对路径的引用，否则 Pages 子路径部署整页白屏。
      # 必须在 build 之后：这一步读的是 dist/index.html，不是源码。
      - run: npm run check:base

      # 资产哈希闸门：public/assets/ 里每个文件都得对得上 round.json 钉的 assethash，
      # 否则线上 iframe 会 404 或渲染出别的内容。改过资产就必须重算并更新 asset_sha256。
      - run: npm run verify:assets

      # 真浏览器基线（Playwright + Chromium）。单测全跑在 jsdom 上，既不执行 CSP、
      # 也不做 MIME 检查，子路径失效与 CSP 写歪这两类整页白屏故障只有真浏览器能兜住。
      # 必须排在 build 之后：webServer 直接吃上一步的 dist/，E2E_PREBUILT=1 跳过重复构建。
      - run: npx playwright install --with-deps chromium
      # 起服务由 playwright.config.ts 的 webServer 托管（preview，端口 4321，单 worker），
      # 别在这里再起一遍 preview，否则 strictPort 直接撞端口。
      - run: npm run e2e
        env:
          E2E_PREBUILT: "1"
