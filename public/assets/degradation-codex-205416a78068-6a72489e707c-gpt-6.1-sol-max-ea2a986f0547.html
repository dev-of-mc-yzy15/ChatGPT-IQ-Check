<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ed">
  <title>鹈鹕漫游记 · 骑着风去兜一圈</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f7f5ed;
      --ink: #2f493f;
      --muted: #858b7c;
      --line: #dedfd3;
      --orange: #d77b51;
      --sky: #edf2e9;
      --sky-horizon: #f6f3df;
      --sea: #c8ded7;
      --hill-back: #d3dfc5;
      --hill-front: #b9cdb0;
      --ground: #e4e7d3;
      --sun: #edc77c;
      --cloud: #fffdf5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, input:focus-visible { outline: 3px solid var(--orange); outline-offset: 5px; }
    button { color: inherit; }
    .page { max-width: 1560px; padding: 0 5.2%; margin: auto; }
    .masthead { min-height: 96px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); gap: 20px; }
    .brand { display: flex; gap: 13px; align-items: center; }
    .brand-mark { width: 43px; height: 43px; flex-shrink: 0; }
    .brand-name { font-size: 19px; font-weight: 650; letter-spacing: 2px; }
    .brand-english { margin-top: 5px; font-size: 8px; font-weight: 600; letter-spacing: 2.5px; }
    .header-note { display: flex; align-items: center; gap: 9px; font-size: 11px; letter-spacing: 2px; color: #748071; }
    .header-note svg { width: 18px; height: 18px; }
    .intro { padding: 39px 0 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; }
    .eyebrow { font-size: 9px; font-weight: 600; letter-spacing: 2.4px; margin: 0 0 13px; color: #8a907e; }
    h1 { font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif; font-size: clamp(30px, 3.7vw, 54px); font-weight: 500; letter-spacing: 3px; line-height: 1.3; margin: 0; }
    h1 em { color: var(--orange); font-style: normal; }
    .intro-copy { margin: 0 2px 3px 0; color: #7f877a; font-size: 12px; letter-spacing: 1.1px; line-height: 1.95; white-space: nowrap; }
    .scene { position: relative; overflow: hidden; border-radius: 14px; border: 1px solid #dce2d4; background: var(--sky); isolation: isolate; }
    .landscape { width: 100%; display: block; aspect-ratio: 2.42; }
    .scene::after { content: ""; pointer-events: none; position: absolute; inset: 0; opacity: .065; z-index: 2; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23525b3d' filter='url(%23n)' opacity='.5' d='M0 0h160v160H0z'/%3E%3C/svg%3E"); }
    .scene-caption { position: absolute; bottom: 21px; left: 27px; right: 27px; display: flex; justify-content: space-between; align-items: center; color: #6f8167; font-size: 9px; font-weight: 500; letter-spacing: 1.5px; z-index: 3; pointer-events: none; }
    .scene-location { display: flex; align-items: center; gap: 8px; }
    .scene-caption svg { width: 13px; height: 13px; }
    .scene-weather { display: flex; gap: 7px; align-items: center; }
    .sky-stop { stop-color: var(--sky); }
    .horizon-stop { stop-color: var(--sky-horizon); }
    .sea { fill: var(--sea); }
    .hill-back { fill: var(--hill-back); }
    .hill-front { fill: var(--hill-front); }
    .ground { fill: var(--ground); }
    .sun { fill: var(--sun); }
    .cloud { fill: var(--cloud); }
    .sky-stop, .horizon-stop, .sea, .hill-back, .hill-front, .ground, .sun, .cloud { transition: fill 1.2s, stop-color 1.2s; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 24px; min-height: 105px; border-bottom: 1px solid var(--line); }
    .play-control { display: flex; align-items: center; gap: 13px; min-width: 190px; }
    .play-button { display: grid; place-items: center; border: none; background: var(--ink); color: var(--paper); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; transition: background .2s, transform .2s; }
    .play-button:hover { background: #436552; transform: scale(1.05); }
    .play-button svg { width: 16px; height: 16px; }
    .control-title { font-size: 12px; letter-spacing: 1px; font-weight: 550; }
    .control-subtitle { color: var(--muted); font-size: 9px; letter-spacing: .8px; margin-top: 6px; display: flex; align-items: center; gap: 5px; }
    .status-dot { height: 4px; width: 4px; border-radius: 100%; background: #8ca47a; }
    body.paused .status-dot { background: #bba888; }
    .speed-control { display: flex; align-items: center; gap: 16px; }
    .speed-label { font-size: 10px; color: #8b9182; letter-spacing: 1px; }
    .speed-control svg { width: 18px; height: 18px; color: #869480; }
    input[type="range"] { width: 132px; height: 20px; margin: 0; cursor: pointer; accent-color: var(--ink); background: transparent; -webkit-appearance: none; appearance: none; }
    input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 3px; background: #d8ddcd; }
    input[type="range"]::-moz-range-track { height: 3px; border-radius: 3px; background: #d8ddcd; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -4.5px; border: 3px solid var(--paper); border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    input[type="range"]::-moz-range-thumb { width: 8px; height: 8px; border: 3px solid var(--paper); border-radius: 50%; background: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
    .speed-value { width: 34px; color: #697b65; font-size: 10px; font-variant-numeric: tabular-nums; }
    .theme-control { display: flex; gap: 3px; padding: 4px; border: 1px solid var(--line); border-radius: 25px; }
    .theme-button { border: none; border-radius: 20px; background: transparent; display: flex; gap: 7px; align-items: center; padding: 8px 14px; font-size: 10px; letter-spacing: .8px; color: #8b8d7e; cursor: pointer; transition: color .2s, background .2s, box-shadow .2s; }
    .theme-button svg { width: 14px; height: 14px; }
    .theme-button[aria-pressed="true"] { background: #fffef8; color: var(--ink); box-shadow: 0 1px 5px #35482e0d; }
    .theme-button:hover { color: var(--ink); }
    footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 21px 0 25px; font-size: 9px; letter-spacing: 1px; color: #949888; }
    .footer-right { font-size: 8px; letter-spacing: 1.7px; display: flex; gap: 9px; align-items: center; }
    .footer-right svg { width: 11px; height: 11px; color: #b4b9a8; }
    body.sunset { --sky: #f3dfce; --sky-horizon: #f7e8cd; --sea: #c8d5cb; --hill-back: #d7d6b9; --hill-front: #bfc3a3; --ground: #e8dfc8; --sun: #e5a46c; --cloud: #fff1df; }
    @media (min-width: 1600px) { .intro { padding-top: 48px; padding-bottom: 35px; } }
    @media (max-width: 800px) {
      .page { padding: 0 5%; }
      .masthead { min-height: 82px; }
      .brand-name { font-size: 16px; }
      .brand-english { font-size: 7px; letter-spacing: 1.8px; }
      .header-note { font-size: 9px; letter-spacing: 1px; }
      .intro { padding: 30px 0 25px; }
      .intro-copy { font-size: 10px; }
      h1 { letter-spacing: 1px; }
      .landscape { aspect-ratio: 1.8; }
      .controls { gap: 15px; }
      .play-control { min-width: unset; }
      .speed-control { gap: 10px; }
      input[type="range"] { width: 90px; }
      .speed-label { display: none; }
      .theme-button { padding: 8px 10px; }
    }
    @media (max-width: 540px) {
      .masthead { min-height: 79px; }
      .brand { gap: 8px; }
      .brand-mark { width: 35px; height: 35px; }
      .header-note span { display: none; }
      .intro { display: block; padding: 30px 0 24px; }
      .eyebrow { font-size: 7px; letter-spacing: 1.7px; }
      h1 { font-size: clamp(27px, 7.3vw, 38px); }
      .intro-copy { margin: 13px 0 0; font-size: 11px; line-height: 1.8; }
      .intro-copy br { display: none; }
      .landscape { aspect-ratio: 1.05; }
      .scene { border-radius: 10px; }
      .scene-caption { bottom: 14px; left: 15px; right: 15px; font-size: 7px; letter-spacing: .4px; }
      .scene-caption svg { width: 11px; height: 11px; }
      .controls { display: grid; grid-template-columns: 1fr auto; padding: 21px 0; gap: 23px 12px; }
      .play-button { width: 40px; height: 40px; }
      .control-title { font-size: 11px; }
      .control-subtitle { font-size: 8px; }
      .speed-control { grid-column: 1 / -1; grid-row: 2; justify-content: center; gap: 16px; }
      .speed-label { display: block; font-size: 9px; }
      input[type="range"] { width: 115px; }
      .theme-control { justify-self: end; }
      .theme-button { font-size: 9px; padding: 7px 9px; gap: 4px; }
      footer { align-items: flex-start; padding-top: 20px; font-size: 8px; line-height: 1.8; gap: 10px; }
      .footer-right { font-size: 6px; letter-spacing: .8px; white-space: nowrap; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1"/>
          <path d="M11 31c0-5 4-8 9-8h5c-1-4-1-8 2-10 2-2 6-1 6 2 0 3-3 4-4 7 0 6-3 10-9 10-4 0-7-2-9-1Z" fill="currentColor"/>

        <div><div class="brand-name">鹈鹕漫游记</div><div class="brand-english">THE PELICAN PEDAL CLUB</div></div>
      </div>
      <div class="header-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M5 19l3-3M16 8l3-3"/><circle cx="12" cy="12" r="3.5"/></svg>
        <span>收集路上的小美好</span>

    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div><p class="eyebrow">LESS HURRY. MORE SCENERY.</p><h1 id="page-title">今天，也要<em>乘风而行。</em></h1></div>
        <p class="intro-copy">把匆忙留在身后，<br>跟着鹈鹕，慢慢看风景。</p>

            </g>

              <path d="M-4-73C-32-60-48-81-36-100-59-113-44-137-24-132-23-158 11-166 23-144 46-154 62-128 43-112 58-87 29-64 7-77Z" fill="#b7c9a6" stroke="none"/>
              <path d="M0-72v-61m0 24-17-13m17 27 20-19" opacity=".7"/>
            </g>
            <g id="cypress"><path d="M0 0v-130" stroke="#8b9c7f" stroke-width="3"/><path d="M-2-167C-12-156-30-102-28-66-27-43-11-40 0-44 12-40 27-46 26-68 24-105 7-156-2-167Z" fill="#a6bd99"/><path d="M0-49v-84" stroke="#839e77" stroke-width="2"/></g>
            <g id="grass" fill="none" stroke="#8caa7b" stroke-width="2" stroke-linecap="round"><path d="M0 0c-1-9-5-14-10-17M0 0c1-12 4-19 7-23M0 0c5-8 9-9 13-10"/></g>

            <!-- Wheels are placed independently so their spokes turn around the hubs. -->

            <path id="near-leg" d="M654 349 727 405 734 469" fill="none" stroke="#e6ad60" stroke-width="4.8" stroke-linejoin="round" stroke-linecap="round"/>

            <g id="pelican">
              <!-- The fluttering scarf tails sit behind the bird's long neck. -->
              <g id="scarf-tails" stroke="#81563e" stroke-width="2" stroke-linejoin="round">
                <path id="scarf-tail-one" d="M726 207C692 209 678 177 647 191L653 204 643 217C673 207 689 233 720 220Z" fill="#ce7953"/>
                <path id="scarf-tail-two" d="M724 212C696 226 682 218 658 234L674 237 677 249C696 230 714 238 732 222Z" fill="#e39b67"/>
                <path d="m655 198 8 3m1 28 9-1" stroke="#f3c68f"/>
              </g>
              <!-- Small tail feathers and the continuous body / neck silhouette. -->
              <path d="m531 290-41-12 13 23-24-5q13 22 48 28" fill="#ede9d7" stroke="#3e5142" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M566 263C542 254 516 269 512 296 503 326 530 349 568 355 619 374 688 363 720 337 747 314 751 289 737 263 721 235 718 212 731 187 740 170 759 168 779 159 800 149 802 124 786 108 768 89 738 91 724 110 710 128 719 152 709 171 687 196 683 225 687 253 651 235 602 242 566 263Z" fill="url(#body-gradient)" stroke="#3e5142" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M708 181C695 223 704 253 718 276 727 297 724 318 704 332 681 351 645 356 610 352 656 365 693 352 715 335 741 313 747 287 732 262 715 230 713 210 728 186Z" fill="#e4e4d0" opacity=".65"/>
              <path d="M523 299q3-18 18-24m-9 32q1-12 9-17" fill="none" stroke="#d5d7c2" stroke-width="2" stroke-linecap="round"/>
              <!-- Generous, unmistakable pelican bill and throat pouch. -->
              <path d="M782 136 945 159C930 174 901 190 865 195 823 200 798 186 787 162Z" fill="url(#pouch-gradient)" stroke="#3e5142" stroke-width="2.3" stroke-linejoin="round"/>
              <path d="M795 151q8 32 36 37m-17-33q14 24 37 33m-16-31q16 20 34 27m-12-25 27 18" fill="none" stroke="#ce9853" stroke-width="1.1" opacity=".65"/>
              <path d="M782 133Q861 135 949 158q7 1 1 5l-163-11" fill="#edb85f" stroke="#3e5142" stroke-width="2.4" stroke-linejoin="round"/>
              <path d="m807 141 113 13" stroke="#ffdda0" stroke-width="2" stroke-linecap="round"/>
              <path d="M789 151q-3 8-2 13" fill="none" stroke="#3e5142" stroke-width="2" stroke-linecap="round"/>
              <circle cx="768" cy="130" r="9" fill="#efe6c9"/>
              <ellipse id="pelican-eye" cx="770" cy="130" rx="4.3" ry="4.3" fill="#304638"/>
              <circle id="eye-shine" cx="771.3" cy="128.8" r="1.2" fill="#fffdf4"/>
              <path d="m762 114 9-2" stroke="#3e5142" stroke-width="2" stroke-linecap="round"/>
              <ellipse cx="759" cy="149" rx="7" ry="3.5" fill="#e6ab87" opacity=".65"/>
              <!-- Little sage-green cycling cap. -->
              <path d="M720 109q-1-32 28-34 28-1 36 30l-37 7Z" fill="#819a74" stroke="#3e5142" stroke-width="2.5"/>
              <path d="M748 76q-11 10-9 31m9-31q17 4 23 29" fill="none" stroke="#647e5c" stroke-width="1.5"/>
              <path d="M716 109q25-10 61-8l19 4q6 4-2 7-23 7-43 2l-28 4q-10 1-7-9Z" fill="#6b8761" stroke="#3e5142" stroke-width="2.3"/>
              <path d="m765 106 21 2" stroke="#acc09a" stroke-width="1.6" stroke-linecap="round"/>
              <ellipse cx="748" cy="75" rx="4" ry="2.8" fill="#405940"/>
              <!-- A neat scarf knot around the neck. -->
              <path d="M709 201q10 9 21 6l-1 17q-13 3-26-8Z" fill="#da865a" stroke="#81563e" stroke-width="2"/>
              <path d="M711 206q8 8 15 6" stroke="#f1b985" stroke-width="2" fill="none"/>
              <path d="M704 207q-13-4-14 5 0 10 14 9l8-5Z" fill="#ce7953" stroke="#81563e" stroke-width="2"/>
              <!-- Wing sweeps forward to hold the handlebar. -->
              <path d="M568 276C597 262 646 280 677 295 716 315 771 313 815 300 826 296 839 298 843 304 849 313 835 318 821 315 772 332 721 336 675 320 670 340 648 351 624 344 592 339 571 316 568 276Z" fill="#f4f0df" stroke="#3e5142" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M583 283q9 32 36 42m-20-42q8 26 33 39m-16-35q12 20 31 28m-8-20q12 13 27 17" fill="none" stroke="#d0d4bd" stroke-width="2" stroke-linecap="round"/>
              <path d="m823 304 9 4m-12 2 8 4" fill="none" stroke="#b8bda6" stroke-width="1.5" stroke-linecap="round"/>
            </g>
            <g id="motion-lines" stroke="#9caa8a" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8"><path d="M444 260h35m-54 16h37m-9 14h19M958 391h25m-12 15h38"/></g>
          </g>
          <g id="foreground" stroke="#8eaa78" stroke-linecap="round" fill="none" opacity=".8"><path d="M-15 604q18-28 9-55m7 53q8-19 26-24m-12 24q12-8 24-4M1406 620q-1-31 15-51m-12 40q18-18 36-16" stroke-width="2.5"/></g>
        </svg>
        <div class="scene-caption" aria-hidden="true">
          <span class="scene-location"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M12.5 6.4c0 3.2-4.5 6.8-4.5 6.8S3.5 9.6 3.5 6.4a4.5 4.5 0 0 1 9 0Z"/><circle cx="8" cy="6.3" r="1.6"/></svg>漫游第一站 · 海岸公路</span>
          <span class="scene-weather"><svg viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M1 5h11c4 0 4-5 1-4M1 8h14c3 0 3 4 0 4M1 11h6c4 0 4 4 1 4"/></svg>微风，适合兜风</span>
        </div>
      </section>

      <section class="controls" aria-label="动画控制">
        <div class="play-control">
          <button id="play-button" class="play-button" type="button" aria-label="暂停动画" aria-pressed="false" title="暂停动画（空格键）"><svg id="pause-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><rect x="5" y="4" width="3" height="12" rx="1"/><rect x="12" y="4" width="3" height="12" rx="1"/></svg><svg id="play-icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" hidden><path d="M6 3.5a1 1 0 0 1 1.5-.85l10 6.5a1 1 0 0 1 0 1.7l-10 6.5A1 1 0 0 1 6 16.5Z"/></svg></button>
          <div><div id="play-title" class="control-title">好心情，骑行中</div><div class="control-subtitle"><span class="status-dot" aria-hidden="true"></span><span id="play-subtitle" role="status">风景一直在路上</span></div></div>
        </div>
        <div class="speed-control">
          <label class="speed-label" for="speed">慢悠悠</label>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M2 8h14c5 0 5-6 1-6M2 12h18c4 0 4 6 0 6M2 16h8c5 0 5 6 1 6"/></svg>
          <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1" aria-label="骑行速度" aria-valuetext="1.0 倍速">
          <output id="speed-value" class="speed-value" for="speed">1.0×</output>
          <span class="speed-label">追着风</span>
        </div>
        <div class="theme-control" role="group" aria-label="风景时段">
          <button class="theme-button" type="button" data-theme="day" aria-pressed="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="3.2"/><path d="M10 1v2m0 14v2M1 10h2m14 0h2M3.6 3.6 5 5m10 10 1.4 1.4M3.6 16.4 5 15M15 5l1.4-1.4"/></svg>晴空</button>
          <button class="theme-button" type="button" data-theme="sunset" aria-pressed="false"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><path d="M2 14h16M4 17h12M5 11a5 5 0 0 1 10 0M10 1v2M3 4l1.5 1.5M17 4l-1.5 1.5M1 10h2m14 0h2"/></svg>晚霞</button>
        </div>
      </section>
    </main>
    <footer><span>一只鹈鹕，一辆单车，一路好风景。</span><span class="footer-right">ENJOY THE LITTLE THINGS<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M7 1v12M1 7h12M3 3l8 8M3 11l8-8"/></svg></span></footer>
  </div>

  <script>
    (() => {
      'use strict';
      const byId = (id) => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const playButton = byId('play-button');
      const speedInput = byId('speed');
      const parts = Object.fromEntries([
        'rear-spokes', 'front-spokes', 'crank', 'near-leg', 'near-leg-outline',
        'far-leg', 'far-leg-outline', 'near-foot', 'far-foot', 'pelican', 'clouds',
        'far-hills', 'trees', 'road-details', 'road-grass', 'motion-lines',
        'scarf-tail-one', 'scarf-tail-two', 'pelican-eye', 'eye-shine', 'bird-one', 'bird-two', 'bird-three'
      ].map((id) => [id, byId(id)]));

      let running = !motionPreference.matches;
      let speed = Number(speedInput.value);
      let elapsed = 0;
      let previous = null;
      let frame = null;

      // Two-bone inverse kinematics keep both webbed feet on their pedals.
      function leg(prefix, hipX, hipY, footX, footY, upper, lower) {
        const dx = footX - hipX;
        const dy = footY - hipY;
        const distance = Math.max(0.001, Math.hypot(dx, dy));
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hipX + along * dx / distance + bend * dy / distance;
        const kneeY = hipY + along * dy / distance - bend * dx / distance;
        const path = `M${hipX.toFixed(2)} ${hipY.toFixed(2)} ${kneeX.toFixed(2)} ${kneeY.toFixed(2)} ${footX.toFixed(2)} ${(footY - 4).toFixed(2)}`;
        parts[`${prefix}-leg`].setAttribute('d', path);
        parts[`${prefix}-leg-outline`].setAttribute('d', path);
        parts[`${prefix}-foot`].setAttribute('transform', `translate(${footX.toFixed(2)} ${(footY - 7).toFixed(2)})`);
      }

      function render(time) {
        const angle = time * 2.7;
        const crankDegrees = angle * 180 / Math.PI;
        const bob = Math.sin(angle * 2) * 1.8;
        const pedalX = Math.cos(angle) * 34;
        const pedalY = Math.sin(angle) * 34;
        parts['rear-spokes'].setAttribute('transform', `rotate(${crankDegrees * 1.8})`);
        parts['front-spokes'].setAttribute('transform', `rotate(${crankDegrees * 1.8})`);
        parts.crank.setAttribute('transform', `translate(700 469) rotate(${crankDegrees})`);
        leg('far', 632, 344 + bob, 700 - pedalX, 469 - pedalY, 94, 91);
        leg('near', 653, 347 + bob, 700 + pedalX, 469 + pedalY, 91, 86);
        parts.pelican.setAttribute('transform', `translate(0 ${bob.toFixed(3)})`);
        parts.clouds.setAttribute('transform', `translate(${-((time * 8) % 1600)} 0)`);
        parts['far-hills'].setAttribute('transform', `translate(${-((time * 13) % 1673)} 0)`);
        parts.trees.setAttribute('transform', `translate(${-((time * 30) % 1670)} 0)`);
        parts['road-details'].setAttribute('transform', `translate(${-((time * 95) % 1600)} 0)`);
        parts['road-grass'].setAttribute('transform', `translate(${-((time * 95) % 1600)} 0)`);
        parts['motion-lines'].setAttribute('opacity', String(.45 + Math.sin(time * 4) * .22));
        const flutter = Math.sin(time * 6) * 5;
        parts['scarf-tail-one'].setAttribute('d', `M726 207C692 ${209 + flutter} 678 ${177 + flutter} 647 ${191 + flutter}L653 ${204 + flutter} 643 ${217 + flutter}C673 ${207 + flutter} 689 233 720 220Z`);
        parts['scarf-tail-two'].setAttribute('d', `M724 212C696 ${226 - flutter} 682 ${218 - flutter} 658 ${234 - flutter}L674 ${237 - flutter} 677 ${249 - flutter}C696 ${230 - flutter} 714 238 732 222Z`);
        const blinking = time % 5.4 > 5.24;
        parts['pelican-eye'].setAttribute('ry', blinking ? '0.7' : '4.3');
        parts['eye-shine'].setAttribute('opacity', blinking ? '0' : '1');
        ['bird-one', 'bird-two', 'bird-three'].forEach((id, index) => {
          parts[id].setAttribute('transform', `translate(${Math.sin(time * .12 + index) * 25} ${Math.sin(time * 1.4 + index) * 3})`);
        });
      }

      function tick(now) {
        frame = null;
        if (!running || document.hidden) { previous = null; return; }
        if (previous !== null) elapsed += Math.min((now - previous) / 1000, .06) * speed;
        previous = now;
        render(elapsed);
        frame = requestAnimationFrame(tick);
      }

      function syncPlayback() {
        document.body.classList.toggle('paused', !running);
        playButton.setAttribute('aria-label', running ? '暂停动画' : '播放动画');
        playButton.setAttribute('aria-pressed', String(!running));
        playButton.title = running ? '暂停动画（空格键）' : '播放动画（空格键）';
        byId('pause-icon').style.display = running ? '' : 'none';
        byId('play-icon').style.display = running ? 'none' : 'block';
        byId('play-title').textContent = running ? '好心情，骑行中' : '停一下，也很好';
        byId('play-subtitle').textContent = running ? '风景一直在路上' : '歇歇脚，再出发';
        previous = null;
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null;
        if (running && !document.hidden) frame = requestAnimationFrame(tick);
      }

      playButton.addEventListener('click', () => { running = !running; syncPlayback(); });
      speedInput.addEventListener('input', () => {
        speed = Number(speedInput.value);
        byId('speed-value').value = `${speed.toFixed(1)}×`;
        speedInput.setAttribute('aria-valuetext', `${speed.toFixed(1)} 倍速`);
      });
      document.querySelectorAll('[data-theme]').forEach((button) => {
        button.addEventListener('click', () => {
          document.body.classList.toggle('sunset', button.dataset.theme === 'sunset');
          document.querySelectorAll('[data-theme]').forEach((item) => {
            item.setAttribute('aria-pressed', String(item === button));
          });
        });
      });
      document.addEventListener('keydown', (event) => {
        const target = event.target;
        if (event.code !== 'Space' || event.repeat || !(target instanceof HTMLElement)) return;
        if (target.closest('button, input, select, textarea, a, [contenteditable]')) return;
        event.preventDefault();
        running = !running;
        syncPlayback();
      });
      document.addEventListener('visibilitychange', syncPlayback);
      motionPreference.addEventListener('change', (event) => { running = !event.matches; syncPlayback(); });
      render(0);
      syncPlayback();
    })();
  </script>
</body>
