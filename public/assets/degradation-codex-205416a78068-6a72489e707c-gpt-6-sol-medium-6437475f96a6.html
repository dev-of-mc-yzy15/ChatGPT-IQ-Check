<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>骑自行车的鹈鹕</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background: #e9f3eb;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .scene { width: min(100vw, 1500px); overflow: hidden; box-shadow: 0 24px 70px #385d5440; }
    svg { display: block; width: 100%; height: auto; }
    .cloud-a { animation: drift 24s linear infinite; }
    .cloud-b { animation: drift 31s linear infinite reverse; }
    .cloud-c { animation: drift 27s linear infinite; }
    .road-marks { animation: road 1.1s linear infinite; }
    .wing { transform-origin: 527px 258px; animation: wing 1.1s ease-in-out infinite; }
    .scarf-tail { transform-origin: 596px 159px; animation: flutter .45s ease-in-out infinite alternate; }
    .body-bob { animation: bob .55s ease-in-out infinite alternate; }
    @keyframes drift { to { transform: translateX(110px); } }
    @keyframes road { to { transform: translateX(-120px); } }
    @keyframes wing { 50% { transform: rotate(-7deg); } }
    @keyframes flutter { to { transform: rotate(10deg); } }
    @keyframes bob { to { transform: translateY(-3px); } }
    @media (prefers-reduced-motion: reduce) {
      .cloud-a, .cloud-b, .cloud-c, .road-marks, .wing, .scarf-tail, .body-bob { animation: none; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
      <title id="title">鹈鹕骑自行车</title>
      <desc id="desc">一只戴着蓝色围巾的白色鹈鹕骑着红色自行车，经过有云朵、草丘与小花的道路。</desc>
      <defs>
        <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#bde9ee"/><stop offset="1" stop-color="#e9f5db"/></linearGradient>
        <linearGradient id="road" x2="0" y2="1"><stop stop-color="#647d7b"/><stop offset="1" stop-color="#405d60"/></linearGradient>
        <linearGradient id="bill" x2="0" y2="1"><stop stop-color="#ffcf79"/><stop offset="1" stop-color="#ef8b51"/></linearGradient>
        <linearGradient id="pouch" x2="0" y2="1"><stop stop-color="#ffd68b"/><stop offset="1" stop-color="#edaa65"/></linearGradient>
        <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
        <g id="cloud" fill="#fff" opacity=".9"><ellipse cx="0" cy="0" rx="67" ry="22"/><circle cx="-30" cy="-14" r="26"/><circle cx="6" cy="-27" r="35"/><circle cx="42" cy="-10" r="26"/></g>
        <g id="flower"><path d="M0 0v19" fill="none" stroke="#458d65" stroke-width="3"/><circle cy="-4" r="5" fill="#fff"/><circle cx="-7" cy="0" r="5" fill="#fff"/><circle cx="7" cy="0" r="5" fill="#fff"/><circle cy="6" r="5" fill="#fff"/><circle r="4" fill="#f5bd56"/></g>
      </defs>

      <!-- Landscape -->
      <path fill="url(#sky)" d="M0 0h1200v700H0z"/>
      <circle cx="1007" cy="112" r="56" fill="#fff4b9" opacity=".9"/>
      <use href="#cloud" class="cloud-a" x="156" y="113"/>
      <use href="#cloud" class="cloud-b" x="779" y="88" transform="scale(.78)"/>
      <use href="#cloud" class="cloud-c" x="1010" y="207" transform="scale(.6)"/>
      <path d="M0 415Q180 305 380 403T790 383T1200 382V573H0Z" fill="#9ccdaf"/>
      <path d="M0 451Q190 402 335 458T690 428T1200 453V583H0Z" fill="#72b895"/>
      <path d="M0 511Q220 477 400 512T800 498T1200 517V595H0Z" fill="#53a881"/>
      <g opacity=".85"><use href="#flower" x="91" y="521"/><use href="#flower" x="170" y="508" transform="rotate(-9 170 508)"/><use href="#flower" x="1000" y="511"/><use href="#flower" x="1105" y="527"/></g>
      <path d="M0 547H1200V700H0Z" fill="url(#road)"/>
      <path d="M0 547H1200" stroke="#d3dbc2" stroke-width="8"/>
      <path d="M0 658H1200" stroke="#abbcb0" stroke-width="5" opacity=".6"/>
      <g class="road-marks" stroke="#dce5cb" stroke-width="8" stroke-linecap="round" opacity=".8">
        <path d="M-70 613h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73m47 0h73"/>
      </g>
      <ellipse cx="598" cy="551" rx="362" ry="18" fill="#253d3e" opacity=".25" filter="url(#shadow)"/>

      <!-- Bicycle wheels -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <g id="rear-wheel" transform="rotate(0 388 490)">
          <circle cx="388" cy="490" r="103" stroke="#263c46" stroke-width="13"/>
          <circle cx="388" cy="490" r="93" stroke="#e2ecdd" stroke-width="5"/>
          <g stroke="#c7d7d2" stroke-width="2.3" opacity=".9">
            <path d="M388 397v186M295 490h186M322 424l132 132m0-132L322 556M340 410l96 160m-144-128 192 96M436 410l-96 160m144-128-192 96"/>
          </g>
        </g>
        <g id="front-wheel" transform="rotate(0 795 490)">
          <circle cx="795" cy="490" r="103" stroke="#263c46" stroke-width="13"/>
          <circle cx="795" cy="490" r="93" stroke="#e2ecdd" stroke-width="5"/>
          <g stroke="#c7d7d2" stroke-width="2.3" opacity=".9">
            <path d="M795 397v186M702 490h186M729 424l132 132m0-132L729 556M747 410l96 160m-144-128 192 96M843 410l-96 160m144-128-192 96"/>
          </g>
        </g>
        <circle cx="388" cy="490" r="13" fill="#f8c36b" stroke="#334d54" stroke-width="5"/>
        <circle cx="795" cy="490" r="13" fill="#f8c36b" stroke="#334d54" stroke-width="5"/>
      </g>

      <!-- Frame, saddle and handlebars -->
      <g fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M388 490 554 490 537 345 388 490M537 345h144L554 490M681 345l114 145" stroke="#d94f4b" stroke-width="13"/>
        <path d="M388 490 554 490 537 345 388 490M537 345h144L554 490M681 345l114 145" stroke="#f47765" stroke-width="4" opacity=".75"/>
        <path d="M534 345 527 321" stroke="#344b51" stroke-width="10"/>
        <path d="M493 319q31-12 80 0 6 14-15 16h-58q-16-2-7-16Z" fill="#344b51" stroke="#344b51" stroke-width="3"/>
        <path d="M679 343 686 318h48q13 0 13 15v16" stroke="#344b51" stroke-width="10"/>
        <path d="M733 348h35" stroke="#253c45" stroke-width="11"/>
        <circle cx="554" cy="490" r="20" fill="#f2bd5b" stroke="#344b51" stroke-width="6"/>
      </g>

      <!-- Bird, drawn above the frame -->
      <g class="body-bob">
        <!-- Tail and far wing -->
        <path d="M426 272q-52-5-93-38 15 44 73 68Z" fill="#dce7d8" stroke="#617c75" stroke-width="5" stroke-linejoin="round"/>
        <path d="M469 292q-17 29-4 48 32 6 61-5" fill="#d8e6da" stroke="#6f8980" stroke-width="5"/>
        <!-- Body and long, curved neck -->
        <path d="M447 218q45-32 111-20 27 2 45 19 5-38 19-73 10-24 27-29 20-2 26 17-34 17-35 75-1 71-33 101-31 29-94 30-67 1-96-39-25-34-4-63 10-12 34-18Z" fill="#fffdf2" stroke="#617c75" stroke-width="6" stroke-linejoin="round"/>
        <path d="M581 247q34 22 60-9" fill="none" stroke="#d6e5da" stroke-width="10" stroke-linecap="round"/>
        <path class="wing" d="M485 226q66-22 109 22-5 42-64 54-41-4-65-33-5-28 20-43Z" fill="#e5efdf" stroke="#6b847d" stroke-width="5"/>
        <path d="M470 267q37 41 96 18" fill="none" stroke="#c8d9cb" stroke-width="5" stroke-linecap="round"/>
        <!-- Head, eye and crest -->
        <path d="M625 121q-5-33 27-43 25-7 42 9 18 18 10 43-14 24-42 25-22-1-37-17Z" fill="#fffdf2" stroke="#617c75" stroke-width="6"/>
        <path d="M642 82q-3-23 8-30m12 25q1-22 15-27" fill="none" stroke="#fffdf2" stroke-width="13" stroke-linecap="round"/>
        <circle cx="677" cy="111" r="7" fill="#263d43"/>
        <circle cx="679" cy="108" r="2.2" fill="#fff"/>
        <!-- Beak and pouch -->
        <path d="M694 132q59 0 177 35-58 18-156 11-21-3-28-21Z" fill="url(#bill)" stroke="#a5694c" stroke-width="5" stroke-linejoin="round"/>
        <path d="M713 178q66 12 147-7-12 64-70 80-50 9-77-73Z" fill="url(#pouch)" stroke="#a5694c" stroke-width="5" stroke-linejoin="round"/>
        <path d="M723 185q39 54 92 44" fill="none" stroke="#ffe0a4" stroke-width="5" opacity=".8"/>
        <path d="M856 167q15 4 16 0" fill="none" stroke="#9b6549" stroke-width="3"/>
        <!-- Scarf -->
        <path d="M604 158q28 10 52 0l-6 19q-22 13-47-2Z" fill="#318db1" stroke="#276b8a" stroke-width="4"/>
        <path class="scarf-tail" d="M605 168q-22 9-49-1l-27 24q38 9 75-4Z" fill="#3a9ec0" stroke="#276b8a" stroke-width="4" stroke-linejoin="round"/>
        <!-- Wings tips -->
        <path d="M490 272q44 28 88 8" fill="none" stroke="#a9c3b6" stroke-width="4" stroke-linecap="round"/>
      </g>

      <!-- Legs and pedals are updated together to keep the feet on the pedals. -->
      <g id="legs" fill="none" stroke="#c87843" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
        <path id="back-leg" d="M526 324 530 397 554 490"/>
        <path id="front-leg" d="M553 327 579 402 554 490"/>
      </g>
      <g id="pedals" fill="none" stroke="#344b51" stroke-linecap="round">
        <path id="crank" d="M554 490h60M554 490h-60" stroke-width="7"/>
        <path id="back-foot" d="M483 489q9 4 23 2" stroke="#efae59" stroke-width="17"/>
        <path id="front-foot" d="M603 489q11 4 24 2" stroke="#efae59" stroke-width="17"/>
        <path id="pedal-bars" d="M489 497h24m89 0h24" stroke-width="7"/>
      </g>

      <!-- A few foreground grass shapes add depth. -->
      <g fill="none" stroke="#368c69" stroke-width="4" stroke-linecap="round" opacity=".9">
        <path d="M39 545q-6-17-15-20m15 20q5-19 16-26m1014 26q-5-18-18-24m18 24q5-19 18-27"/>
      </g>
    </svg>
  </main>
  <script>
    (() => {
      const rear = document.getElementById('rear-wheel');
      const front = document.getElementById('front-wheel');
      const backLeg = document.getElementById('back-leg');
      const frontLeg = document.getElementById('front-leg');
      const crank = document.getElementById('crank');
      const backFoot = document.getElementById('back-foot');
      const frontFoot = document.getElementById('front-foot');
      const pedalBars = document.getElementById('pedal-bars');
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const centerX = 554, centerY = 490, radius = 60;

      function draw(time) {
        const phase = reducedMotion.matches ? 0 : time * 0.0035;
        const angle = phase * 180 / Math.PI;
        rear.setAttribute('transform', `rotate(${angle} 388 490)`);
        front.setAttribute('transform', `rotate(${angle} 795 490)`);
        const aX = centerX + Math.cos(phase) * radius;
        const aY = centerY + Math.sin(phase) * radius;
        const bX = centerX - Math.cos(phase) * radius;
        const bY = centerY - Math.sin(phase) * radius;
        // The knee follows the foot with a small forward bend.
        frontLeg.setAttribute('d', `M553 327 Q${(553 + aX) / 2 + 34} ${(327 + aY) / 2 - 12} ${aX} ${aY}`);
        backLeg.setAttribute('d', `M526 324 Q${(526 + bX) / 2 + 24} ${(324 + bY) / 2 - 9} ${bX} ${bY}`);
        crank.setAttribute('d', `M${aX} ${aY}L${bX} ${bY}`);
        frontFoot.setAttribute('d', `M${aX - 8} ${aY - 3}q11 8 27 3`);
        backFoot.setAttribute('d', `M${bX - 8} ${bY - 3}q11 8 27 3`);
        pedalBars.setAttribute('d', `M${aX - 12} ${aY + 8}h28 M${bX - 12} ${bY + 8}h28`);
        if (!reducedMotion.matches) requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
      reducedMotion.addEventListener('change', () => requestAnimationFrame(draw));
    })();
  </script>
</body>
</html>
