<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鹈鹕骑自行车</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #a8dff0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .scene {
      width: min(100vw, 1100px);
      aspect-ratio: 16 / 9;
      filter: drop-shadow(0 18px 24px rgb(35 72 80 / 18%));
    }
    svg { width: 100%; height: 100%; display: block; }
    .wheel-spin { transform-box: fill-box; transform-origin: center; animation: spin 1.7s linear infinite; }
    .ride-bob { transform-box: fill-box; transform-origin: center bottom; animation: bob .85s ease-in-out infinite; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: spin 1.7s linear infinite; }
    .wing-flap { transform-box: fill-box; transform-origin: 70% 20%; animation: flap .85s ease-in-out infinite; }
    .cloud-drift { animation: drift 18s linear infinite; }
    .cloud-drift.slow { animation-duration: 26s; animation-delay: -8s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes flap { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    @keyframes drift { from { transform: translateX(-180px); } to { transform: translateX(1180px); } }
  </style>
</head>
<body>
  <div class="scene" aria-label="一只鹈鹕正在骑自行车的二维动画">
    <svg viewBox="0 0 1100 620" role="img">
      <defs>
        <linearGradient id="sky" x2="0" y2="1">
          <stop stop-color="#80d4ee"/><stop offset="1" stop-color="#d8f4ed"/>
        </linearGradient>
        <linearGradient id="water" x2="0" y2="1">
          <stop stop-color="#51b9bd"/><stop offset="1" stop-color="#248ca4"/>
        </linearGradient>
        <linearGradient id="feather" x2="1" y2="1">
          <stop stop-color="#fffdf2"/><stop offset="1" stop-color="#d7e7e5"/>
        </linearGradient>
        <linearGradient id="beak" x2="0" y2="1">
          <stop stop-color="#ffbc55"/><stop offset="1" stop-color="#ee704e"/>
        </linearGradient>
      </defs>

      <!-- sky, sun, clouds and distant water -->
      <rect width="1100" height="620" fill="url(#sky)"/>
      <circle cx="890" cy="112" r="55" fill="#ffe99a" opacity=".9"/>
      <g class="cloud-drift" fill="#fff" opacity=".72">
        <path d="M-100 135 Q-70 102 -35 125 Q-7 80 38 120 Q75 111 93 145 H-100Z"/>
      </g>
      <g class="cloud-drift slow" fill="#fff" opacity=".55">
        <path d="M-90 245 Q-55 204 -16 236 Q10 190 60 231 Q98 221 122 255 H-90Z"/>
      </g>
      <path d="M0 378 Q130 330 260 380 T520 375 T780 382 T1100 368 V620 H0Z" fill="url(#water)"/>
      <path d="M0 435 Q160 405 310 440 T620 432 T930 437 T1100 426" fill="none" stroke="#b8e9d9" stroke-width="8" opacity=".45"/>
      <path d="M35 510 Q135 478 235 510 M790 520 Q885 488 1010 516" fill="none" stroke="#d2f1df" stroke-width="7" stroke-linecap="round" opacity=".45"/>

      <!-- floating reeds -->
      <g fill="none" stroke="#277f74" stroke-width="7" stroke-linecap="round">
        <path d="M70 620 Q74 552 50 500 M73 570 Q100 535 119 516 M72 545 Q45 525 29 501"/>
        <path d="M1000 620 Q1008 555 1035 505 M1005 570 Q978 540 960 521 M1007 545 Q1040 525 1054 493"/>
      </g>
      <g fill="#a7cb55"><ellipse cx="46" cy="493" rx="12" ry="21" transform="rotate(-35 46 493)"/><ellipse cx="116" cy="510" rx="11" ry="22" transform="rotate(45 116 510)"/><ellipse cx="963" cy="516" rx="11" ry="21" transform="rotate(-45 963 516)"/><ellipse cx="1053" cy="490" rx="12" ry="22" transform="rotate(38 1053 490)"/></g>

      <!-- bicycle -->
      <g stroke="#263c52" stroke-linecap="round" stroke-linejoin="round">
        <g fill="none" stroke-width="8">
          <circle cx="355" cy="475" r="91" fill="#8be0d2"/>
          <circle cx="750" cy="475" r="91" fill="#8be0d2"/>
          <path d="M355 475 L486 313 L590 475 L355 475 L425 475 M486 313 L550 313 M590 475 L650 302 L717 317 M650 302 L684 294"/>
        </g>
        <g class="wheel-spin" fill="none" stroke="#ffffff" stroke-width="3" opacity=".7">
          <circle cx="355" cy="475" r="78"/><circle cx="750" cy="475" r="78"/>
          <path d="M355 397V553M277 475H433M300 420L410 530M300 530L410 420"/>
          <path d="M750 397V553M672 475H828M695 420L805 530M695 530L805 420"/>
        </g>
        <g class="pedal" fill="none" stroke="#263c52" stroke-width="7">
          <circle cx="590" cy="475" r="27"/><path d="M590 475 L570 447 M590 475 L612 502"/><path d="M552 444h30 M600 503h30"/>
        </g>
        <path d="M476 306 Q466 282 482 263" fill="none" stroke-width="9"/>
        <path d="M467 265 h39" fill="none" stroke-width="9"/>
        <path d="M648 301 Q665 277 688 294" fill="none" stroke-width="8"/>
        <path d="M688 294 h36" fill="none" stroke-width="8"/>
      </g>

      <!-- pelican rider -->
      <g class="ride-bob">
        <!-- rear feather tail -->
        <path d="M506 337 Q450 327 424 365 Q461 363 482 382 Q444 389 430 414 Q486 403 530 374Z" fill="#c6dcda" stroke="#263c52" stroke-width="6"/>
        <!-- body -->
        <path d="M502 195 Q566 158 634 202 Q676 229 663 315 Q650 371 579 381 Q507 382 474 325 Q451 258 502 195Z" fill="url(#feather)" stroke="#263c52" stroke-width="7"/>
        <!-- wing -->
        <path class="wing-flap" d="M551 220 Q606 208 642 251 Q657 287 621 321 Q574 344 534 317 Q565 290 551 220Z" fill="#b8d4d4" stroke="#263c52" stroke-width="6"/>
        <path d="M575 246 Q608 273 601 311" fill="none" stroke="#8eafb2" stroke-width="5"/>
        <!-- long neck and head -->
        <path d="M526 219 Q504 169 527 120 Q547 81 598 91 Q641 104 636 151 Q632 185 604 211Z" fill="url(#feather)" stroke="#263c52" stroke-width="7"/>
        <path d="M529 126 Q520 86 555 61 Q594 37 625 64 Q653 88 635 125 Q610 145 576 131Z" fill="#fffdf2" stroke="#263c52" stroke-width="7"/>
        <!-- beak and pouch -->
        <path d="M575 109 Q643 102 731 137 Q750 147 729 162 Q650 175 578 140Z" fill="url(#beak)" stroke="#263c52" stroke-width="7"/>
        <path d="M584 140 Q649 168 727 155 Q700 206 622 188 Q591 175 584 140Z" fill="#f28668" stroke="#263c52" stroke-width="6"/>
        <circle cx="595" cy="94" r="8" fill="#263c52" stroke="none"/><circle cx="598" cy="91" r="3" fill="#fff" stroke="none"/>
        <!-- feet / legs -->
        <g fill="none" stroke="#e7754b" stroke-width="8">
          <path d="M543 356 Q548 399 570 445"/><path d="M619 354 Q605 405 590 449"/>
        </g>
        <g fill="none" stroke="#e7754b" stroke-width="6" stroke-linecap="round">
          <path d="M568 445 l-19 8 M568 445 l9 10 M590 449 l-19 5 M590 449 l11 9"/>
        </g>
        <!-- scarf -->
        <path d="M522 158 Q566 177 616 161 L615 184 Q566 201 527 181Z" fill="#ef6e55" stroke="#263c52" stroke-width="5"/>
        <path d="M608 177 l28 39 l-31 -13 l-18 29 l-5 -42Z" fill="#ef6e55" stroke="#263c52" stroke-width="5"/>
      </g>

      <!-- little motion marks -->
      <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".8">
        <path d="M170 278 h48"/><path d="M130 308 h27"/><path d="M872 286 h47"/>
      </g>
      <text x="550" y="580" text-anchor="middle" fill="#e5fff2" font-size="22" font-weight="700" letter-spacing="5">PELICAN ON THE MOVE</text>
    </svg>
  </div>
</body>
</html>
