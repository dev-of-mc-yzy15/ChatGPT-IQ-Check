<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 安全策略必须早于所有资源引用。纯静态 Pages 只能靠 meta：frame-ancestors 在 meta 中不生效（浏览器只认 HTTP 头），仍列出，换宿主补头时可直接复用同一策略。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-YxrfH0O065Och1OB+EmHCtT+cibhGfdW6+gauG5ooxI='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
    />
    <!-- 字体自托管（见 src/styles/tokens.css 的 @font-face），无需外部域，首屏不再等 CDN。 -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="非官方项目：展示 CodexRadar 公开的 RadarBench 分数、覆盖率与日桶趋势。分数是第三方基准测试分数，不是心理学 IQ。" />
    <meta name="theme-color" content="#FBFBFC" />
    <meta name="color-scheme" content="light dark" />
    <meta property="og:title" content="降智雷达 · CodexRadar 分数与趋势" />
    <meta property="og:description" content="本轮雷达 + RadarBench 日桶趋势。非官方项目，与 OpenAI 无关联。" />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231c211e'/%3E%3Cg fill='none' stroke='%23f2a17b' stroke-width='1.4'%3E%3Ccircle cx='16' cy='16' r='9'/%3E%3Ccircle cx='16' cy='16' r='4'/%3E%3Cpath d='M16 3v5M29 16h-5M16 29v-5M3 16h5M16 16l7-7'/%3E%3C/g%3E%3C/svg%3E" />
    <meta name="twitter:card" content="summary" />
    <link rel="canonical" href="https://dev-of-mc-yzy15.github.io/ChatGPT-IQ-Check/" />
    <title>降智雷达 · CodexRadar 分数与趋势</title>
    <script>
      // 首绘主题：先读存储；存储不可用（无痕模式、禁用 storage）就落到系统偏好，别让整块一起失效。
      var saved = null;
      try {
        var k = "iq-radar-theme";
        var s = localStorage.getItem(k);
        if (s === "light" || s === "dark") saved = s;
      } catch (_) {}
      try {
        // 先把 dataset 落成合法值：saved 命中用它，否则先按 light，偏好探测失败也不至于空着。
        var t = saved;
        document.documentElement.dataset.theme = t === null ? "light" : t;
        if (t === null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          t = "dark";
          document.documentElement.dataset.theme = t;
        }
        // 首屏就把浏览器配色定对，跟 useTheme 运行期写入同一套取值。
        var m = document.querySelector('meta[name="theme-color"]');
        if (!m) {
          m = document.createElement("meta");
          m.setAttribute("name", "theme-color");
          document.head.appendChild(m);
        }
        m.setAttribute("content", t === "dark" ? "#08090C" : "#FBFBFC");
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main>
        <h1>降智雷达</h1>
        <p>本页面需要 JavaScript。数据来源：codexradar.com。非官方项目，与 OpenAI 无关联。</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
